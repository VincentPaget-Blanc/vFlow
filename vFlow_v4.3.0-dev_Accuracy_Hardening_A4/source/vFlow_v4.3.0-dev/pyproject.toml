[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vflow"
version = "4.2.0"
description = "Desktop flow-cytometry and single-particle fluorescence analysis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "scipy",
]

[project.optional-dependencies]
advanced = ["scikit-learn>=1.3"]
test = ["pytest", "scikit-learn>=1.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
vflow = "vflow.main:main"

[tool.setuptools.package-data]
vflow = ["docs/*.svg"]
